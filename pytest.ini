[pytest]
testpaths =
    legacy/tests
    skills/audio_management
norecursedirs =
    old_version_reference
    venv
    .git
    build
    dist
    __pycache__
    tools
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
